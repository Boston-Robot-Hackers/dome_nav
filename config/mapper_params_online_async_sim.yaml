# mapper_params_online_async_sim.yaml — simulation slam_toolbox config for dome_nav.
#
# Copy of mapper_params_online_async.yaml with sim-only overrides for faster/finer map updates.
# The real robot keeps slam_toolbox's stock motion-gating to protect the Pi's
# scan-matching under load; in sim those coarse gates make the map grow only in
# large, laggy jumps (only the spawn scan exists until the robot drives 0.5 m,
# and /map rebuilds just every 5 s), which starves early frontier exploration.
# The three "# SIM" lines below are the only differences from mapper_params_online_async.yaml.
# Loaded verbatim via online_async_launch.py (slam_params_file=); use_sim_time
# comes from that include. map_file_name omitted (slam_manager_node persists).
#
# Used by: sim_slam.launch.py, sim_explore.launch.py.
# Author: Pito Salas and Claude Code
# Open Source Under MIT license

slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping #localization

    # ADDED (upstream leaves these commented): the DOME robot always boots at the
    # same physical dock origin, so start every map there. map_start_pose and
    # map_start_at_dock are mutually exclusive upstream (pose wins if both given);
    # both are set here to match the pre-refactor slam_param_patch behavior.
    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 #if 0 never publishes odometry
    map_update_interval: 1.0  # SIM (real 5.0): rebuild /map every 1 s so it fills in smoothly
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.0 #for rastering images
    max_laser_range: 10.0  # CHANGED from upstream 20.0: dome lidar max usable range
    minimum_time_interval: 0.5
    transform_timeout: 0.5  # CHANGED from upstream 0.2: more TF tolerance on the Pi
    tf_buffer_duration: 50.0  # CHANGED from upstream 30.0: larger buffer for slow systems
    message_queue_size: 20  # ADDED (not in upstream): prevent dropped scans under load
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1  # SIM (real 0.5): fold scans every 0.1 m so the map grows early
    minimum_travel_heading: 0.1  # SIM (real 0.5): fold scans every ~6 deg of rotation
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
