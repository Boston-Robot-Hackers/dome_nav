# nav2_params_explore_real.yaml -- full Nav2 config for Mode E (exploration) on
# the physical robot. Full copy of nav2_bringup/nav2_params.yaml with overrides
# baked in; `# upstream:` comments mark every value that differs from upstream.
# Only sections navigation_launch.py reads are kept (amcl/map_saver/loopback dropped).
# Sim counterpart: nav2_params_explore_sim.yaml (differs on vx_max/vx_min +
# velocity_smoother caps). Re-sync by hand from upstream after a distro upgrade.

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    use_realtime_priority: false
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.3  # upstream: 0.5
      movement_time_allowance: 30.0  # upstream: 10.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.5  # upstream: 0.25
      yaw_goal_tolerance: 1.0  # upstream: 0.25
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000  # upstream: 2000
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      ay_min: -3.0
      az_max: 3.5  # matches upstream
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.6  # upstream: 0.5; real robot spec max fwd
      vx_min: -0.6  # upstream: -0.35; real robot spec max reverse
      vy_max: 0.5
      wz_max: 1.4  # upstream: 1.9; real robot spec max turn
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.3  # upstream: 0.1; Pi TF stale >0.1s under MPPI load -> FOLLOW/TF_ERROR
      temperature: 0.3
      gamma: 0.015
      motion_model: DiffDrive
      visualize: false  # upstream: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5  # upstream: 1.4 -- caused crawl inside 1.4m of goal
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 0.5  # upstream: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0  # upstream: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 6  # upstream: 5
        threshold_to_consider: 1.4  # matches upstream
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.2  # upstream: 2.0
        offset_from_furthest: 20  # upstream: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5  # upstream: 3
      height: 5  # upstream: 3
      resolution: 0.05
      robot_radius: 0.15  # upstream: 0.22
      plugins:
      - voxel_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0  # matches upstream
        inflation_radius: 0.25  # upstream: 0.7; must exceed footprint circumscribed radius 0.164
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      always_send_full_costmap: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.15  # upstream: 0.22
      resolution: 0.05
      track_unknown_space: true
      # lethal_cost_threshold/unknown_cost_value/trinary_costmap are top-level
      # Costmap2DROS params (upstream leaves them at C++ defaults 100/255/true).
      # unknown_cost_value -1 matches OccupancyGrid's "-1 = unknown".
      lethal_cost_threshold: 65  # upstream: 100
      unknown_cost_value: -1  # upstream: 255
      trinary_costmap: true  # matches upstream default
      plugins:  # upstream: ['static_layer', 'obstacle_layer', 'inflation_layer'] -- obstacle_layer dropped
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        enabled: true  # new (not in upstream)
        map_topic: /map  # new (not in upstream)
        subscribe_to_updates: true  # new (not in upstream)
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0  # matches upstream
        inflation_radius: 0.2 # upstream: 0.7; lowered from 0.7 to open up space near walls/doorways
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins:
    - GridBased
    costmap_update_timeout: 1.0
    GridBased:
      plugin: nav2_smac_planner::SmacPlanner2D  # upstream: 'nav2_navfn_planner::NavfnPlanner'
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
      max_iterations: 1000000  # new (not in upstream)
      max_planning_time: 2.0  # new (not in upstream)
smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.4  # upstream: 1.0; real robot spec max turn
    min_rotational_vel: 0.3  # upstream: 0.4; real robot spec min turn
    rotational_acc_lim: 3.2
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations:
    - AdjustSpeedLimit
    - ReroutingService
    - CollisionMonitor
    ReroutingService:
      plugin: nav2_route::ReroutingService
    AdjustSpeedLimit:
      plugin: nav2_route::AdjustSpeedLimit
    CollisionMonitor:
      plugin: nav2_route::CollisionMonitor
      max_collision_dist: 3.0
    edge_cost_functions:
    - DistanceScorer
    - CostmapScorer
    DistanceScorer:
      plugin: nav2_route::DistanceScorer
    CostmapScorer:
      plugin: nav2_route::CostmapScorer
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:  # upstream: [0.5, 0.0, 2.0]; real robot spec: fwd 0.6, turn 1.4
    - 0.6
    - 0.0
    - 1.4
    min_velocity:  # upstream: [-0.5, 0.0, -2.0]; real robot spec: rev -0.6, turn -1.4
    - -0.6
    - 0.0
    - -1.4
    max_accel:  # upstream: [2.5, 0.0, 3.2]
    - 0.8
    - 0.0
    - 2.0
    max_decel:  # upstream: [-2.5, 0.0, -3.2]
    - -0.8
    - 0.0
    - -2.0
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity:  # matches upstream; MUST stay [0,0,0] -- a turn deadband
    - 0.0                # zeros MPPI's normal small commands and the robot stops
    - 0.0                # moving (see experiment.md E0-E3)
    - 0.0
    velocity_timeout: 1.0
collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - FootprintApproach
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources:
    - scan
    scan:
      type: scan
      topic: scan
      min_height: 0.15
      max_height: 2.0
      enabled: true
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins:
    - simple_charging_dock
    simple_charging_dock:
      plugin: opennav_docking::SimpleChargingDock
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: local_costmap/costmap_raw
      footprint_topic: local_costmap/published_footprint
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
