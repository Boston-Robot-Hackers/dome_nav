# mapper_params_online_async.yaml — real-robot slam_toolbox config for dome_nav.
#
# This is a copy of slam_toolbox's upstream mapper_params_online_async.yaml
# (deliberately kept under the same filename) with the LEAST POSSIBLE changes
# from that upstream version — no runtime patch chain. Every line that differs
# from upstream is marked "# CHANGED" / "# ADDED" with the reason; everything
# else is verbatim upstream, so re-syncing after a distro upgrade is a simple
# diff against the installed mapper_params_online_async.yaml.
# Loaded verbatim via the standard online_async_launch.py include
# (slam_params_file=). use_sim_time is supplied by that include's own arg, not
# baked here. map_file_name is intentionally omitted: slam_manager_node owns map
# persistence (see its map_persist_path param), so each run starts a fresh map
# and there is no auto-resume of a saved posegraph on startup.
#
# Used by: robot_map.launch.py (Mode A), robot_explore.launch.py (Mode E real).
# Sim uses mapper_params_online_async_sim.yaml (a copy of this with finer/faster map-update settings).
# Author: Pito Salas and Claude Code
# Open Source Under MIT license

slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping #localization

    # ADDED (upstream leaves these commented): the DOME robot always boots at the
    # same physical dock origin, so start every map there. map_start_pose and
    # map_start_at_dock are mutually exclusive upstream (pose wins if both given);
    # both are set here to match the pre-refactor slam_param_patch behavior.
    map_start_pose: [0.0, 0.0, 0.0]
    map_start_at_dock: true

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.05  # CHANGED from upstream 0.02: 50->20Hz map->odom TF, less TF load on the Pi (if 0, never publishes)
    map_update_interval: 10.0  # CHANGED from upstream 5.0: halve the map-raster/publish spike frequency
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.0 #for rastering images
    max_laser_range: 10.0  # CHANGED from upstream 20.0: dome lidar max usable range
    minimum_time_interval: 0.5
    transform_timeout: 0.5  # CHANGED from upstream 0.2: more TF tolerance on the Pi
    tf_buffer_duration: 50.0  # CHANGED from upstream 30.0: larger buffer for slow systems
    message_queue_size: 40  # ADDED (not in upstream; was 20): larger buffer to further reduce dropped scans under load
    stack_size_to_use: 40000000 #// program needs a larger stack size to serialize large maps
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.5
    minimum_travel_heading: 0.5
    check_min_dist_and_heading_precisely: false
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
