# nav2_param_patch.yaml — dome robot overrides applied on top of nav2_bringup defaults.
# Only values that differ from nav2_bringup/nav2_params.yaml are listed here.

local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.15
      width: 5
      height: 5
      inflation_layer:
        inflation_radius: 0.2
        cost_scaling_factor: 10.0

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.15
      plugins: ["static_layer", "inflation_layer"]
      inflation_layer:
        inflation_radius: 0.5
        cost_scaling_factor: 15.0
      static_layer:
        enabled: true
        map_topic: /map
        subscribe_to_updates: true
        lethal_cost_threshold: 65
        unknown_cost_value: -1
        trinary_costmap: true

controller_server:
  ros__parameters:
    goal_checker:
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      desired_linear_vel: 0.3
      max_angular_accel: 3.2

velocity_smoother:
  ros__parameters:
    max_velocity: [0.4, 0.0, 1.9]
    min_velocity: [-0.4, 0.0, -1.9]
    max_accel: [1.5, 0.0, 3.2]
    max_decel: [-1.5, 0.0, -3.2]

collision_monitor:
  ros__parameters:
    FootprintApproach:
      points: "[[0.25, 0.25], [0.25, -0.25], [-0.25, -0.25], [-0.25, 0.25]]"
      min_points: 1           # collision_monitor not actively used on dome


docking_server:
  ros__parameters:
    dock_database: ""
    dock_plugins: []

lifecycle_manager:
  ros__parameters:
    node_names:
      - planner_server
      - controller_server
      - smoother_server
      - recoveries_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother

