# nav2_param_patch.yaml — dome robot overrides applied on top of nav2_bringup defaults.
# Only values that differ from nav2_bringup/nav2_params.yaml are listed here.

local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.15
      width: 5
      height: 5
      inflation_layer:
        # inflation_radius reverted to 0.2 (F13 T04h had temporarily lowered it
        # to 0.15 to fit worlds/simple_room.world's 0.6m doorway, but Nav2 itself
        # flagged 0.15 as below the footprint's own computed inscribed radius
        # (0.157) -- too small to be safe regardless of doorway width. A new
        # world (wider doorway) removes the constraint that motivated 0.15.
        # cost_scaling_factor stays raised: steeper cost decay near the robot's
        # own radius is a general improvement, not tied to any specific doorway.
        inflation_radius: 0.2
        cost_scaling_factor: 20.0

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.15
      plugins: ["static_layer", "inflation_layer"]
      inflation_layer:
        inflation_radius: 0.5
        cost_scaling_factor: 15.0
      static_layer:
        enabled: true
        map_topic: /map
        subscribe_to_updates: true
        lethal_cost_threshold: 65
        unknown_cost_value: -1
        trinary_costmap: true

controller_server:
  ros__parameters:
    goal_checker:
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      desired_linear_vel: 0.3
      max_angular_accel: 3.2

velocity_smoother:
  ros__parameters:
    max_velocity: [0.4, 0.0, 1.9]
    min_velocity: [-0.4, 0.0, -1.9]
    max_accel: [1.5, 0.0, 3.2]
    max_decel: [-1.5, 0.0, -3.2]

docking_server:
  ros__parameters:
    dock_database: ""

lifecycle_manager:
  ros__parameters:
    node_names:
      - planner_server
      - controller_server
      - smoother_server
      - recoveries_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother

