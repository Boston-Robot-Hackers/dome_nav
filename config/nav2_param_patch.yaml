# nav2_param_patch.yaml — dome robot overrides applied on top of nav2_bringup defaults.
# Only values that differ from nav2_bringup/nav2_params.yaml are listed here.

local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.15
      width: 5
      height: 5
      inflation_layer:
        # F13 T04r: lowered from 0.2 -> 0.16, just above Nav2's own safety floor
        # (the footprint's computed inscribed radius, ~0.157 -- see T04h, which
        # found Nav2 rejects 0.15 as unsafe). A smaller inflated zone reduces
        # the chance a robot that stops slightly off-goal lands inside a
        # lethal/inflated cell -- the "Start occupied" SmacPlanner2D failure
        # found in T04r's telemetry analysis (explore-toy6-20260706.jsonl).
        # cost_scaling_factor raised further (20 -> 30) for a steeper decay,
        # keeping the elevated-cost region tight around the smaller radius.
        # F13 T04t: raised again, 0.16 -> 0.17. controller_server logged
        # "inflation radius (0.16) is smaller than the circumscribed radius
        # (0.164142)" on every run, forcing MPPI to do full-footprint
        # collision checks on every candidate trajectory instead of using the
        # costmap potential field fast path -- measured actual robot speed at
        # ~0.15 m/s against a configured 0.45 m/s cruise speed. 0.17 clears
        # the 0.164142 floor with a small margin.
        inflation_radius: 0.17
        cost_scaling_factor: 30.0

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.15
      plugins: ["static_layer", "inflation_layer"]
      inflation_layer:
        inflation_radius: 0.5
        cost_scaling_factor: 15.0
      static_layer:
        enabled: true
        map_topic: /map
        subscribe_to_updates: true
        lethal_cost_threshold: 65
        unknown_cost_value: -1
        trinary_costmap: true

planner_server:
  ros__parameters:
    GridBased:
      # F13 T04p: switched from the default nav2_navfn_planner::NavfnPlanner --
      # see TF13 T04m/T04p for the "Failed to create a plan from potential when
      # a legal potential was found" bug this works around (confirmed as a known
      # unresolved upstream NavFn defect, not a config issue in this repo:
      # ros-navigation/navigation2#4655). SmacPlanner2D uses a different search
      # algorithm (A* on the costmap grid) with no shared code path.
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 2.0

controller_server:
  ros__parameters:
    goal_checker:
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      desired_linear_vel: 0.3
      max_angular_accel: 3.2

velocity_smoother:
  ros__parameters:
    max_velocity: [0.4, 0.0, 1.9]
    min_velocity: [-0.4, 0.0, -1.9]
    max_accel: [1.5, 0.0, 3.2]
    max_decel: [-1.5, 0.0, -3.2]

docking_server:
  ros__parameters:
    dock_database: ""

lifecycle_manager:
  ros__parameters:
    node_names:
      - planner_server
      - controller_server
      - smoother_server
      - recoveries_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother

